# Enables the dedicated Shibboleth security chain.
app.shibboleth.enabled=true

# Redirect back to the frontend callback route after a successful SAML login.
# In local development this is the Vite dev server; production deployments should override it.
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5174}
app.shibboleth.success-redirect=${SHIBBOLETH_SUCCESS_REDIRECT:http://localhost:5174/sso-callback}

# ===== Service Provider (this app) =====
spring.security.saml2.relyingparty.registration.shibboleth-sp.entity-id=${SAML_SP_ENTITY_ID:{baseUrl}/saml2/service-provider-metadata/{registrationId}}
spring.security.saml2.relyingparty.registration.shibboleth-sp.signing.credentials[0].private-key-location=${SAML_SP_PRIVATE_KEY:file:./saml-credentials/sp-private-key.key}
spring.security.saml2.relyingparty.registration.shibboleth-sp.signing.credentials[0].certificate-location=${SAML_SP_CERTIFICATE:file:./saml-credentials/sp-certificate.crt}

# ===== Asserting Party (IdP) =====
# Prefer the metadata file handed to us by the IdP/admin when available. This keeps the app
# pinned to the trusted IdP certificate and entity ID instead of a stale localhost placeholder.
spring.security.saml2.relyingparty.registration.shibboleth-sp.assertingparty.entity-id=${SAML_IDP_ENTITY_ID:https://fc94bed96e9b/idp/shibboleth}
spring.security.saml2.relyingparty.registration.shibboleth-sp.assertingparty.metadata-uri=${SAML_IDP_METADATA_URI:file:./shibboleth-metadata.xml}
spring.security.saml2.relyingparty.registration.shibboleth-sp.assertingparty.singlesignon.sign-request=true

logging.level.org.springframework.security.saml2=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.opensaml=DEBUG